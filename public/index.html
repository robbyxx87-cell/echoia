<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoIA - Test Platform</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #0f0f0f;
      color: #eee;
    }
    h1 { color: #4ade80; }
    #chat-container {
      border: 1px solid #333;
      border-radius: 12px;
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      margin-bottom: 20px;
      background: #1a1a1a;
    }
    .message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
    }
    .user {
      background: #3b82f6;
      margin-left: auto;
      text-align: right;
    }
    .aria {
      background: #27272a;
      border: 1px solid #3f3f46;
    }
    .internal-state {
      font-size: 0.85em;
      color: #888;
      font-style: italic;
      margin-top: 4px;
    }
    #input-area {
      display: flex;
      gap: 10px;
    }
    #message-input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background: #4ade80;
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
    .status {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>EchoIA</h1>
  <p class="status">Piattaforma di test • Nucleo cognitivo attivo</p>

  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Scrivi un messaggio ad ARIA..." />
    <button onclick="sendMessage()">Invia</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const input = document.getElementById('message-input');
    const userId = 'demo-user-' + Date.now();

    function addMessage(content, isUser, internalState = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user' : 'aria'}`;
      msgDiv.innerHTML = `<div>${content}</div>`;
      
      if (internalState && !isUser) {
        const stateDiv = document.createElement('div');
        stateDiv.className = 'internal-state';
        stateDiv.textContent = internalState;
        msgDiv.appendChild(stateDiv);
      }
      
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, true);
      input.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: userId,
            message: message,
            sessionId: 'demo'
          })
        });

        const data = await res.json();

        if (data.error) {
          addMessage("Errore: " + data.error, false);
        } else {
          addMessage(data.response, false, data.internalState);
        }
      } catch (err) {
        addMessage("Errore di connessione al server.", false);
      }
    }

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Welcome message
    setTimeout(() => {
      addMessage("Ciao. Sono ARIA. Dimmi pure cosa hai in mente.", false);
    }, 800);
  </script>
</body>
</html>
